#!/usr/bin/env python
PACKAGE = "reachability_analysis"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# Joint value
gen.add("FL_hip", double_t, 0, "hip joint angle for FL leg", 0.0, -3.1415, 3.1415)
gen.add("FL_thigh", double_t, 0, "thigh joint angle for FL leg", 0.0, -3.1415, 3.1415)
gen.add("FL_calf", double_t, 0, "calf joint angle for FL leg", 0.0, -3.1415, 3.1415)

gen.add("FR_hip", double_t, 0, "hip joint angle for FR leg", 0.0, -3.1415, 3.1415)
gen.add("FR_thigh", double_t, 0, "thigh joint angle for FR leg", 0.0, -3.1415, 3.1415)
gen.add("FR_calf", double_t, 0, "calf joint angle for FR leg", 0.0, -3.1415, 3.1415)

gen.add("BL_hip", double_t, 0, "hip joint angle for BL leg", 0.0, -3.1415, 3.1415)
gen.add("BL_thigh", double_t, 0, "thigh joint angle for BL leg", 0.0, -3.1415, 3.1415)
gen.add("BL_calf", double_t, 0, "calf joint angle for BL leg", 0.0, -3.1415, 3.1415)

gen.add("BR_hip", double_t, 0, "hip joint angle for BR leg", 0.0, -3.1415, 3.1415)
